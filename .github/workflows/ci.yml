name: Aegis Protocol CI & Verification Matrix

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Fatal Python lint and frontend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install flake8
      - run: flake8 backend tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: JavaScript regression contracts
        run: |
          for test in tests/frontend/test_*.js; do node "$test"; done
      - run: python scripts/validation/verify_frozen_benchmarks.py

  unit-and-chaos-matrix:
    name: Unit, chaos and security (Python ${{ matrix.python-version }})
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-rerunfailures
      - name: Run isolated offline suites
        run: pytest tests/unit tests/chaos tests/security -q
      - name: Verify no tracked research outputs were mutated
        if: always()
        run: |
          python scripts/validation/verify_frozen_benchmarks.py
          git diff --exit-code -- tests/retrieval_benchmark artifacts research

  full-offline-regression:
    name: Entire offline suite, persistence and release validators
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-rerunfailures
      - name: Run all discovered offline tests
        run: pytest tests/ -q
      - name: Isolated offline release smoke
        run: python scripts/validate_release_candidate_smoke.py
      - name: Fresh-process persistence and historical reader compatibility
        run: python scripts/validate_rollback_compatibility.py
      - name: Verify frozen datasets and tracked output integrity
        if: always()
        run: |
          python scripts/validation/verify_frozen_benchmarks.py
          git diff --exit-code -- tests/retrieval_benchmark artifacts research
