name: Aegis Protocol CI & Verification Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality:
    name: Code Quality & Schema Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Linting Tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python Codebase
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,build,dist

  unit-and-chaos-matrix:
    name: Unit & Chaos Fault Injection (Python ${{ matrix.python-version }})
    needs: [code-quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-rerunfailures

      - name: Run Core Unit & Agent Reach Chaos Suite
        env:
          ENVIRONMENT: test
          AEGIS_MOCK_LLM: "true"
          AGENT_REACH_ENABLED: "true"
        run: |
          pytest -v tests/unit/ tests/chaos/ tests/security/ --maxfail=2

  provenance-and-benchmarks:
    name: Research Provenance, Lineage & Performance Benchmarks
    needs: [unit-and-chaos-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Full Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-rerunfailures

      - name: Execute Truth Dossier & Replay Ledger Integration Tests
        env:
          ENVIRONMENT: test
          AEGIS_MOCK_LLM: "true"
          AGENT_REACH_ENABLED: "true"
        run: |
          pytest -v tests/integration/test_claim_pipeline.py -k test_verify_claim_produces_lineage_and_replay_dossier
          pytest -v tests/benchmarks/test_research_performance.py

      - name: Run Empirical Evaluation Runner Verification
        env:
          ENVIRONMENT: test
          AEGIS_MOCK_LLM: "true"
        run: |
          python scripts/evaluate_dataset.py --target "Vaccines undergo double-blind clinical trials before regulatory distribution"
