<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claim Status & Telemetry — Aegis Protocol</title>
  <meta name="description" content="View real-time investigation timeline, evidence log, and final verdict for any claim ID.">
  <link rel="stylesheet" href="aegis-theme.css">
  <script src="forensic-explorer.js"></script>
  <style>
    .status-container {
      max-width: 820px;
      margin: 0 auto 80px;
      padding: 110px 32px 40px;
      position: relative;
      z-index: 2;
    }
    .status-input-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .status-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    #claimIdInput {
      flex: 1;
      min-width: 240px;
      background: rgba(7, 9, 14, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    #claimIdInput:focus {
      border-color: var(--accent);
    }
    #checkBtn {
      padding: 12px 24px;
      background: #fff;
      color: #06080d;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      font-family: var(--font-main);
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    #checkBtn:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }
    #checkBtn:disabled {
      opacity: 0.6;
    }

    /* Result card */
    .result-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Verdict badge */
    .verdict-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .v-badge {
      padding: 4px 14px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-family: var(--font-mono);
    }
    .v-true     { background: rgba(16, 185, 129, 0.12); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .v-false    { background: rgba(244, 63, 94, 0.12);  color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.3); }
    .v-mislead  { background: rgba(245, 158, 11, 0.12); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .v-pending  { background: rgba(0, 229, 255, 0.12);  color: var(--accent); border: 1px solid rgba(0, 229, 255, 0.3); }
    .v-status   { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--border); }

    /* Claim text box */
    .claim-text-box {
      background: rgba(7, 9, 14, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #fff;
    }

    /* Confidence bar */
    .conf-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .conf-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .conf-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width 0.6s ease;
    }
    .conf-label {
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--accent);
      min-width: 44px;
      text-align: right;
    }

    /* Timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 20px 0;
    }
    .tl-item {
      display: flex;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .tl-item:last-child {
      border-bottom: none;
    }
    .tl-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 2px;
    }
    .tl-dot.done      { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .tl-dot.active    { background: rgba(0, 229, 255, 0.15); color: var(--accent); border: 1px solid rgba(0, 229, 255, 0.4); animation: pulseDot 1.5s infinite; }
    .tl-dot.failed    { background: rgba(244, 63, 94, 0.15); color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.3); }
    .tl-dot.skipped   { background: rgba(245, 158, 11, 0.12); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .tl-dot.wait      { background: rgba(255, 255, 255, 0.05); color: var(--text-dim); border: 1px solid var(--border); }
    .tl-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
      letter-spacing: 0.04em;
    }
    .tl-badge-done    { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .tl-badge-active  { background: rgba(0, 229, 255, 0.15); color: var(--accent); border: 1px solid rgba(0, 229, 255, 0.3); }
    .tl-badge-failed  { background: rgba(244, 63, 94, 0.15); color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.3); }
    .tl-badge-skipped { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .tl-badge-wait    { background: rgba(255, 255, 255, 0.05); color: var(--text-dim); border: 1px solid var(--border); }
    .tl-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
    }
    .tl-desc  {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .tl-time  {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-top: 3px;
    }

    /* Evidence items */
    .evidence-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .ev-item {
      background: rgba(7, 9, 14, 0.8);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .ev-text {
      font-size: 0.86rem;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 6px;
    }
    .ev-source {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* Reasoning */
    .reasoning-box {
      background: rgba(7, 9, 14, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .info-banner {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-family: var(--font-mono);
    }
    .info-banner.warn { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.25); color: #fbbf24; }
    .info-banner.err  { background: rgba(244, 63, 94, 0.08);  border: 1px solid rgba(244, 63, 94, 0.25);  color: var(--rose); }
    .info-banner.ok   { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); color: var(--emerald); }

    @media (max-width: 640px) {
      .status-container { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <script>window.AEGIS_ACTIVE='status';</script>
  <script src="aegis-nav.js"></script>

  <div class="status-container">
    <div class="ae-reveal" style="margin-bottom:32px;">
      <div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);letter-spacing:0.08em;margin-bottom:6px;">// REAL-TIME AUDIT LOG</div>
      <h1 style="font-size:clamp(2rem, 3.5vw, 2.6rem);font-weight:800;letter-spacing:-0.03em;color:#fff;">
        Claim Status &amp; Investigation Log
      </h1>
      <p style="color:var(--text-muted);font-size:0.98rem;max-width:600px;margin-top:6px;">
        Lookup any claim ID to inspect parallel agent research, evidence provenance, and the Byzantine consensus verdict.
      </p>
    </div>

    <!-- Input Card -->
    <div class="status-input-card ae-reveal">
      <div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-bottom:12px;">// CLAIM ID LOOKUP</div>
      <div class="status-row">
        <input type="text" id="claimIdInput" placeholder="Enter claim ID (e.g. 9c8c267e-0c08-46d9-ba6a-04cabd4313f2)">
        <button id="checkBtn" onclick="checkStatus()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Check Status
        </button>
      </div>
    </div>

    <!-- Result area -->
    <div id="resultArea"></div>
  </div>

  <footer class="ae-footer">
    <div>
      <div style="font-weight:700;color:#fff;font-size:0.95rem;margin-bottom:2px;">Aegis Protocol</div>
      <div style="font-size:0.75rem;color:var(--text-dim);">Evidence-Based Misinformation Investigation System &copy; 2026</div>
    </div>
    <div style="display:flex;gap:18px;font-size:0.8rem;">
      <a href="index.html" style="color:var(--text-muted);text-decoration:none;">Home</a>
      <a href="submit.html" style="color:var(--accent);text-decoration:none;">Submit Claim</a>
      <a href="dashboard.html" style="color:var(--text-muted);text-decoration:none;">Dashboard</a>
    </div>
  </footer>

  <script>
    const BACKEND = (typeof window !== 'undefined' && window.AEGIS_API_BASE)
      ? window.AEGIS_API_BASE.replace(/\/+$/, '')
      : '';
    let autoRefreshTimer = null;

    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    if (urlId) {
      document.getElementById('claimIdInput').value = urlId;
      window.addEventListener('DOMContentLoaded', () => checkStatus());
    }

    document.getElementById('claimIdInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkStatus();
    });

    function verdictBadgeClass(v) {
      if (!v) return 'v-pending';
      const lv = v.toLowerCase();
      if (lv === 'true') return 'v-true';
      if (lv === 'false') return 'v-false';
      if (lv.includes('mislead')) return 'v-mislead';
      return 'v-pending';
    }

    function tlDotClass(state) {
      if (state === 'COMPLETE') return 'done';
      if (state === 'RUNNING') return 'active';
      if (state === 'FAILED') return 'failed';
      if (state === 'SKIPPED') return 'skipped';
      return 'wait';
    }

    function tlDotIcon(state) {
      if (state === 'COMPLETE') return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
      if (state === 'FAILED') return '<span style="font-size:12px;font-weight:900;">✕</span>';
      if (state === 'SKIPPED') return '<span style="font-size:10px;">—</span>';
      return '';
    }

    function tlBadge(state) {
      const clsMap = {
        'COMPLETE': 'tl-badge-done',
        'RUNNING': 'tl-badge-active',
        'FAILED': 'tl-badge-failed',
        'SKIPPED': 'tl-badge-skipped',
        'UNAVAILABLE': 'tl-badge-wait',
        'NOT_STARTED': 'tl-badge-wait'
      };
      return `<span class="tl-badge ${clsMap[state] || 'tl-badge-wait'}">${state}</span>`;
    }

    function renderResult(data) {
      const area = document.getElementById('resultArea');
      const isCompleted = data.status === 'completed';
      const isPending = data.status === 'pending' || data.status === 'processing';
      const isFailed = data.status === 'failed';

      // Stage 1: Claim Ingestion
      const s1State = (data.created_at || data.claim_text) ? 'COMPLETE' : 'NOT_STARTED';
      const s1Desc = data.claim_id ? `Claim registered with unique identifier ${data.claim_id.slice(0, 8)}...` : 'Claim ingested into persistence store';

      // Stage 2: Normalization
      let s2State = 'NOT_STARTED';
      let s2Desc = 'Semantic tokenization and syntax parsing';
      if (data.normalized_text) {
        s2State = 'COMPLETE';
        s2Desc = `Normalized text: "${data.normalized_text.slice(0, 90)}${data.normalized_text.length > 90 ? '...' : ''}"`;
      } else if (isPending) {
        s2State = 'RUNNING';
        s2Desc = 'Normalizing statement syntax...';
      } else if (isFailed) {
        s2State = 'FAILED';
        s2Desc = 'Normalization halted due to execution failure.';
      } else if (isCompleted) {
        s2State = 'SKIPPED';
        s2Desc = 'Raw claim verified without separate normalization record.';
      }

      // Stage 3: Multi-Source Evidence Retrieval
      let s3State = 'NOT_STARTED';
      let s3Desc = 'Searching academic, regulatory, and public archives';
      const evCount = (data.evidence && Array.isArray(data.evidence)) ? data.evidence.length : 0;
      if (evCount > 0) {
        s3State = 'COMPLETE';
        s3Desc = `${evCount} verifiable source records retrieved and indexed`;
      } else if (isPending) {
        s3State = 'RUNNING';
        s3Desc = 'Retrieving evidence across configured channels...';
      } else if (isFailed) {
        s3State = 'FAILED';
        s3Desc = 'Evidence retrieval encountered an error.';
      } else if (isCompleted) {
        s3State = 'UNAVAILABLE';
        s3Desc = 'No verifiable external evidence found for this claim.';
      }

      // Stage 4: Epistemic Analysis & Verification
      let s4State = 'NOT_STARTED';
      let s4Desc = 'Cross-referencing source lineage and evidence confidence';
      if (data.verdict) {
        s4State = 'COMPLETE';
        s4Desc = `Verdict rendered: ${String(data.verdict).toUpperCase()}${data.confidence != null ? ` (${Math.round(data.confidence * 100)}% confidence)` : ''}`;
      } else if (isPending) {
        s4State = 'RUNNING';
        s4Desc = 'Weighing source reliability and independence...';
      } else if (isFailed) {
        s4State = 'FAILED';
        s4Desc = 'Verification stopped before synthesis.';
      } else if (isCompleted) {
        s4State = 'SKIPPED';
        s4Desc = 'Insufficient evidence to compute definitive verdict.';
      }

      // Stage 5: Final Truth Dossier
      let s5State = 'NOT_STARTED';
      let s5Desc = 'Packaging provenance trail and audit log';
      if (isCompleted) {
        s5State = 'COMPLETE';
        s5Desc = 'Truth dossier finalized and locked in audit ledger';
      } else if (isFailed) {
        s5State = 'FAILED';
        s5Desc = 'Investigation failed: ' + (data.error || 'Pipeline execution interrupted');
      } else if (isPending) {
        s5State = 'RUNNING';
        s5Desc = 'Awaiting pipeline completion...';
      }

      const confPct = data.confidence != null ? Math.round(data.confidence * 100) : null;

      let html = `<div class="result-card ae-reveal visible">`;

      html += `<div class="verdict-row">
        <span class="v-badge v-status">${(data.status || 'UNKNOWN').toUpperCase()}</span>
        ${data.verdict ? `<span class="v-badge ${verdictBadgeClass(data.verdict)}">${String(data.verdict).toUpperCase()}</span>` : ''}
        ${data.severity ? `<span class="v-badge" style="background:rgba(245,158,11,0.1);color:#fbbf24;border:1px solid rgba(245,158,11,0.2);">${String(data.severity).toUpperCase()}</span>` : ''}
      </div>`;

      if (data.claim_text || data.normalized_text) {
        html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-bottom:8px;">// CLAIM STATEMENT</div>
          <div class="claim-text-box">${data.claim_text || data.normalized_text}</div>`;
      }

      if (confPct != null) {
        const barColor = confPct >= 70 ? 'var(--emerald)' : confPct >= 40 ? 'var(--amber)' : 'var(--rose)';
        html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-bottom:8px;">// CONFIDENCE COEFFICIENT</div>
          <div class="conf-row">
            <div class="conf-bar"><div class="conf-fill" style="width:${confPct}%;background:${barColor};"></div></div>
            <span class="conf-label" style="color:${barColor};">${confPct}%</span>
          </div>`;
      }

      html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-top:24px;margin-bottom:8px;">// INVESTIGATION TIMELINE</div>
        <div class="timeline">
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s1State)}">${tlDotIcon(s1State)}</div><div><div class="tl-title">Claim Ingested ${tlBadge(s1State)}</div><div class="tl-desc">${s1Desc}</div>${data.created_at ? `<div class="tl-time">${new Date(data.created_at).toLocaleString()}</div>` : ''}</div></div>
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s2State)}">${tlDotIcon(s2State)}</div><div><div class="tl-title">Claim Normalization ${tlBadge(s2State)}</div><div class="tl-desc">${s2Desc}</div></div></div>
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s3State)}">${tlDotIcon(s3State)}</div><div><div class="tl-title">Multi-Source Retrieval ${tlBadge(s3State)}</div><div class="tl-desc">${s3Desc}</div></div></div>
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s4State)}">${tlDotIcon(s4State)}</div><div><div class="tl-title">Epistemic Analysis ${tlBadge(s4State)}</div><div class="tl-desc">${s4Desc}</div></div></div>
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s5State)}">${tlDotIcon(s5State)}</div><div><div class="tl-title">Truth Dossier ${tlBadge(s5State)}</div><div class="tl-desc">${s5Desc}</div>${data.updated_at && isCompleted ? `<div class="tl-time">${new Date(data.updated_at).toLocaleString()}</div>` : ''}</div></div>
        </div>`;

      if (data.reasoning) {
        html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-top:24px;margin-bottom:8px;">// SYNTHESIZED REASONING</div>
          <div class="reasoning-box">${data.reasoning}</div>`;
      }

      if (data.evidence && data.evidence.length > 0) {
        html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-top:24px;margin-bottom:8px;">// HARVESTED EVIDENCE (${data.evidence.length} items)</div>
          <div class="evidence-list">`;
        data.evidence.forEach((ev, i) => {
          html += `<div class="ev-item">
            <div class="ev-text">${ev.summary || ev.text || 'Evidence node ' + (i + 1)}</div>
            ${ev.source ? `<div class="ev-source">Source: ${ev.source}</div>` : ''}
            ${ev.url ? `<div style="margin-top:6px;"><a href="${ev.url}" target="_blank" rel="noopener" style="color:var(--accent);font-size:0.78rem;font-weight:600;text-decoration:none;">View Provenance Source &rarr;</a></div>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-top:24px;margin-bottom:8px;">// FORENSIC RESEARCH FUNNEL &amp; SOURCE EXPLORER</div>
        <div id="statusForensicMount"></div>`;

      if (isPending) {
        html += `<div class="info-banner warn" style="margin-top:20px;">
          Investigation in progress — refreshing status in 5 seconds...
        </div>`;
        clearTimeout(autoRefreshTimer);
        autoRefreshTimer = setTimeout(() => checkStatus(true), 5000);
      }

      html += `</div>`;
      area.innerHTML = html;

      // Mount Forensic Explorer
      const fMount = document.getElementById('statusForensicMount');
      if (fMount && window.ForensicExplorer && data.id) {
        const explorer = new window.ForensicExplorer(fMount);
        explorer.loadFromClaimId(data.id);
      }
    }

    let statusTimerInterval = null;

    async function checkStatus(silent = false) {
      const id = document.getElementById('claimIdInput').value.trim();
      if (!id) return;

      const btn = document.getElementById('checkBtn');
      const area = document.getElementById('resultArea');

      if (!silent) {
        btn.innerHTML = `<span class="pulse-dot-cyan"></span> Checking...`;
        btn.disabled = true;

        if (statusTimerInterval) clearInterval(statusTimerInterval);
        const startTime = performance.now();

        area.innerHTML = `
          <div class="ae-loading-preview">
            <div class="ae-loading-top">
              <div class="ae-loading-title-wrap">
                <div class="ae-radar-spinner"></div>
                <div class="ae-loading-title">Retrieving Cluster Telemetry for <span style="color:var(--accent);">${id.slice(0, 8)}...</span></div>
              </div>
              <div class="ae-loading-timer-badge" id="statusElapsedBadge">
                <span style="width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);"></span>
                <span>0.0s elapsed</span>
              </div>
            </div>
            <div class="ae-progress-track">
              <div class="ae-progress-fill" id="statusProgressFill" style="width:30%;background:linear-gradient(90deg, #00e5ff, #6366f1, #10b981);"></div>
            </div>
            <div class="ae-skeleton-grid">
              <div class="ae-skeleton-card">
                <div class="ae-skeleton-bar" style="height:14px;width:30%;"></div>
                <div class="ae-skeleton-bar" style="height:20px;width:85%;"></div>
                <div class="ae-skeleton-bar" style="height:12px;width:60%;"></div>
              </div>
              <div class="ae-skeleton-card">
                <div class="ae-skeleton-bar" style="height:14px;width:40%;"></div>
                <div class="ae-skeleton-bar" style="height:14px;width:95%;"></div>
                <div class="ae-skeleton-bar" style="height:14px;width:70%;"></div>
              </div>
            </div>
          </div>
        `;

        statusTimerInterval = setInterval(() => {
          const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
          const badge = document.getElementById('statusElapsedBadge');
          if (badge) badge.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);"></span><span>${elapsed}s elapsed</span>`;
        }, 100);
      }

      try {
        let data = null;
        const endpoints = [
          (window.getAegisApiUrl ? window.getAegisApiUrl(`/api/claims/${encodeURIComponent(id)}`) : `/api/claims/${encodeURIComponent(id)}`)
        ];

        for (const ep of endpoints) {
          try {
            const res = await fetch(ep, { signal: AbortSignal.timeout(8000) });
            if (res.ok) {
              data = await res.json();
              break;
            }
          } catch (_) {}
        }

        if (statusTimerInterval) {
          clearInterval(statusTimerInterval);
          statusTimerInterval = null;
        }

        if (!data) throw new Error('Claim not found or backend node initializing');
        renderResult(data);
        window.aegisAudio && window.aegisAudio.playSuccess();
      } catch (err) {
        if (statusTimerInterval) {
          clearInterval(statusTimerInterval);
          statusTimerInterval = null;
        }
        area.innerHTML = `<div class="info-banner err">
          ${err.message.includes('not found') ? 'Claim not found. Check the ID and try again.' : 'Backend is initializing or claim not found. Try again in 20 seconds.'}
        </div>`;
      } finally {
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Check Status`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
