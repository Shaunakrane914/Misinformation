<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claim Status & Telemetry — Aegis Protocol</title>
  <meta name="description" content="View real-time investigation timeline, evidence log, and final verdict for any claim ID.">
  <link rel="stylesheet" href="aegis-theme.css">
  <style>
    .status-container {
      max-width: 820px;
      margin: 0 auto 80px;
      padding: 110px 32px 40px;
      position: relative;
      z-index: 2;
    }
    .status-input-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .status-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    #claimIdInput {
      flex: 1;
      min-width: 240px;
      background: rgba(7, 9, 14, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    #claimIdInput:focus {
      border-color: var(--accent);
    }
    #checkBtn {
      padding: 12px 24px;
      background: #fff;
      color: #06080d;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      font-family: var(--font-main);
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    #checkBtn:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }
    #checkBtn:disabled {
      opacity: 0.6;
    }

    /* Result card */
    .result-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Verdict badge */
    .verdict-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .v-badge {
      padding: 4px 14px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-family: var(--font-mono);
    }
    .v-true     { background: rgba(16, 185, 129, 0.12); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .v-false    { background: rgba(244, 63, 94, 0.12);  color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.3); }
    .v-mislead  { background: rgba(245, 158, 11, 0.12); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .v-pending  { background: rgba(0, 229, 255, 0.12);  color: var(--accent); border: 1px solid rgba(0, 229, 255, 0.3); }
    .v-status   { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--border); }

    /* Claim text box */
    .claim-text-box {
      background: rgba(7, 9, 14, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #fff;
    }

    /* Confidence bar */
    .conf-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .conf-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .conf-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width 0.6s ease;
    }
    .conf-label {
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--accent);
      min-width: 44px;
      text-align: right;
    }

    /* Timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 20px 0;
    }
    .tl-item {
      display: flex;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .tl-item:last-child {
      border-bottom: none;
    }
    .tl-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 2px;
    }
    .tl-dot.done  { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .tl-dot.active{ background: rgba(0, 229, 255, 0.15); color: var(--accent); border: 1px solid rgba(0, 229, 255, 0.4); animation: pulseDot 1.5s infinite; }
    .tl-dot.wait  { background: rgba(255, 255, 255, 0.05); color: var(--text-dim); border: 1px solid var(--border); }
    .tl-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
    }
    .tl-desc  {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .tl-time  {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-top: 3px;
    }

    /* Evidence items */
    .evidence-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }
    .ev-item {
      background: rgba(7, 9, 14, 0.8);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .ev-text {
      font-size: 0.86rem;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 6px;
    }
    .ev-source {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* Reasoning */
    .reasoning-box {
      background: rgba(7, 9, 14, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .info-banner {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-family: var(--font-mono);
    }
    .info-banner.warn { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.25); color: #fbbf24; }
    .info-banner.err  { background: rgba(244, 63, 94, 0.08);  border: 1px solid rgba(244, 63, 94, 0.25);  color: var(--rose); }
    .info-banner.ok   { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); color: var(--emerald); }

    @media (max-width: 640px) {
      .status-container { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <script>window.AEGIS_ACTIVE='status';</script>
  <script src="aegis-nav.js"></script>

  <div class="status-container">
    <div class="ae-reveal" style="margin-bottom:32px;">
      <div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);letter-spacing:0.08em;margin-bottom:6px;">// REAL-TIME AUDIT LOG</div>
      <h1 style="font-size:clamp(2rem, 3.5vw, 2.6rem);font-weight:800;letter-spacing:-0.03em;color:#fff;">
        Claim Status &amp; Investigation Log
      </h1>
      <p style="color:var(--text-muted);font-size:0.98rem;max-width:600px;margin-top:6px;">
        Lookup any claim ID to inspect parallel agent research, evidence provenance, and the Byzantine consensus verdict.
      </p>
    </div>

    <!-- Input Card -->
    <div class="status-input-card ae-reveal">
      <div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-bottom:12px;">// CLAIM ID LOOKUP</div>
      <div class="status-row">
        <input type="text" id="claimIdInput" placeholder="Enter claim ID (e.g. 9c8c267e-0c08-46d9-ba6a-04cabd4313f2)">
        <button id="checkBtn" onclick="checkStatus()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Check Status
        </button>
      </div>
    </div>

    <!-- Result area -->
    <div id="resultArea"></div>
  </div>

  <footer class="ae-footer">
    <div>
      <div style="font-weight:700;color:#fff;font-size:0.95rem;margin-bottom:2px;">Aegis Protocol</div>
      <div style="font-size:0.75rem;color:var(--text-dim);">Autonomous Multi-Agent AI Defense System &copy; 2026</div>
    </div>
    <div style="display:flex;gap:18px;font-size:0.8rem;">
      <a href="index.html" style="color:var(--text-muted);text-decoration:none;">Home</a>
      <a href="submit.html" style="color:var(--accent);text-decoration:none;">Submit Claim</a>
      <a href="dashboard.html" style="color:var(--text-muted);text-decoration:none;">Dashboard</a>
    </div>
  </footer>

  <script>
    const BACKEND = (typeof window !== 'undefined' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'))
      ? ''
      : 'https://misinformation-1ouh.onrender.com';
    let autoRefreshTimer = null;

    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    if (urlId) {
      document.getElementById('claimIdInput').value = urlId;
      window.addEventListener('DOMContentLoaded', () => checkStatus());
    }

    document.getElementById('claimIdInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkStatus();
    });

    function verdictBadgeClass(v) {
      if (!v) return 'v-pending';
      const lv = v.toLowerCase();
      if (lv === 'true') return 'v-true';
      if (lv === 'false') return 'v-false';
      if (lv.includes('mislead')) return 'v-mislead';
      return 'v-pending';
    }

    function tlDotClass(state) {
      if (state === 'done') return 'done';
      if (state === 'active') return 'active';
      return 'wait';
    }

    function tlDotIcon(state) {
      if (state === 'done') return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
      if (state === 'active') return '';
      return '';
    }

    function renderResult(data) {
      const area = document.getElementById('resultArea');
      const isCompleted = data.status === 'completed';
      const isPending = data.status === 'pending';

      const s1 = data.created_at ? 'done' : 'active';
      const s2 = data.normalized_text ? 'done' : (isPending ? 'active' : 'wait');
      const s3 = (data.evidence && data.evidence.length > 0) ? 'done' : (isPending ? 'active' : 'wait');
      const s4 = data.verdict ? 'done' : (isPending ? 'active' : 'wait');
      const s5 = isCompleted ? 'done' : (isPending ? 'active' : 'wait');

      const confPct = data.confidence != null ? Math.round(data.confidence * 100) : null;

      let html = `<div class="result-card ae-reveal visible">`;

      html += `<div class="verdict-row">
        <span class="v-badge v-status">${data.status.toUpperCase()}</span>
        ${data.verdict ? `<span class="v-badge ${verdictBadgeClass(data.verdict)}">${data.verdict.toUpperCase()}</span>` : ''}
        ${data.severity ? `<span class="v-badge" style="background:rgba(245,158,11,0.1);color:#fbbf24;border:1px solid rgba(245,158,11,0.2);">${data.severity.toUpperCase()}</span>` : ''}
      </div>`;

      if (data.claim_text || data.normalized_text) {
        html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-bottom:8px;">// CLAIM STATEMENT</div>
          <div class="claim-text-box">${data.claim_text || data.normalized_text}</div>`;
      }

      if (confPct != null) {
        const barColor = confPct >= 70 ? 'var(--emerald)' : confPct >= 40 ? 'var(--amber)' : 'var(--rose)';
        html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-bottom:8px;">// CONFIDENCE COEFFICIENT</div>
          <div class="conf-row">
            <div class="conf-bar"><div class="conf-fill" style="width:${confPct}%;background:${barColor};"></div></div>
            <span class="conf-label" style="color:${barColor};">${confPct}%</span>
          </div>`;
      }

      html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-top:24px;margin-bottom:8px;">// INVESTIGATION TIMELINE</div>
        <div class="timeline">
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s1)}">${tlDotIcon(s1)}</div><div><div class="tl-title">Claim Ingested</div><div class="tl-desc">Dispatched to autonomous ingestion queues</div>${data.created_at ? `<div class="tl-time">${new Date(data.created_at).toLocaleString()}</div>` : ''}</div></div>
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s2)}">${tlDotIcon(s2)}</div><div><div class="tl-title">Normalization &amp; Spectral Fit</div><div class="tl-desc">Zipf-Mandelbrot rank regression and semantic normalization</div></div></div>
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s3)}">${tlDotIcon(s3)}</div><div><div class="tl-title">Multi-Agent Research</div><div class="tl-desc">Scouting market anomalies, RSS feeds, and social graphs</div></div></div>
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s4)}">${tlDotIcon(s4)}</div><div><div class="tl-title">Byzantine Arbitration</div><div class="tl-desc">W-MSR outlier pruning and consensus voting</div></div></div>
          <div class="tl-item"><div class="tl-dot ${tlDotClass(s5)}">${tlDotIcon(s5)}</div><div><div class="tl-title">Dossier Finalized</div><div class="tl-desc">Verifiable truth dossier generated</div>${data.updated_at && isCompleted ? `<div class="tl-time">${new Date(data.updated_at).toLocaleString()}</div>` : ''}</div></div>
        </div>`;

      if (data.reasoning) {
        html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-top:24px;margin-bottom:8px;">// SYNTHESIZED REASONING</div>
          <div class="reasoning-box">${data.reasoning}</div>`;
      }

      if (data.evidence && data.evidence.length > 0) {
        html += `<div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);margin-top:24px;margin-bottom:8px;">// HARVESTED EVIDENCE (${data.evidence.length} items)</div>
          <div class="evidence-list">`;
        data.evidence.forEach((ev, i) => {
          html += `<div class="ev-item">
            <div class="ev-text">${ev.summary || ev.text || 'Evidence node ' + (i + 1)}</div>
            ${ev.source ? `<div class="ev-source">Source: ${ev.source}</div>` : ''}
            ${ev.url ? `<div style="margin-top:6px;"><a href="${ev.url}" target="_blank" rel="noopener" style="color:var(--accent);font-size:0.78rem;font-weight:600;text-decoration:none;">View Provenance Source &rarr;</a></div>` : ''}
          </div>`;
        });
        html += `</div>`;
      }

      if (isPending) {
        html += `<div class="info-banner warn" style="margin-top:20px;">
          Swarm is actively investigating — auto-refreshing in 5 seconds...
        </div>`;
        clearTimeout(autoRefreshTimer);
        autoRefreshTimer = setTimeout(() => checkStatus(true), 5000);
      }

      html += `</div>`;
      area.innerHTML = html;
    }

    async function checkStatus(silent = false) {
      const id = document.getElementById('claimIdInput').value.trim();
      if (!id) return;

      const btn = document.getElementById('checkBtn');
      const area = document.getElementById('resultArea');

      if (!silent) {
        btn.textContent = 'Checking...'; btn.disabled = true;
        area.innerHTML = `<div class="info-banner warn">Loading claim status...</div>`;
      }

      try {
        let data = null;
        const endpoints = [
          `/api/claims/${encodeURIComponent(id)}`,
          `https://misinformation-1ouh.onrender.com/api/claims/${encodeURIComponent(id)}`
        ];

        for (const ep of endpoints) {
          try {
            const res = await fetch(ep, { signal: AbortSignal.timeout(8000) });
            if (res.ok) {
              data = await res.json();
              break;
            }
          } catch (_) {}
        }

        if (!data) throw new Error('Claim not found or backend node initializing');
        renderResult(data);
        window.aegisAudio && window.aegisAudio.playSuccess();
      } catch (err) {
        area.innerHTML = `<div class="info-banner err">
          ${err.message.includes('not found') ? 'Claim not found. Check the ID and try again.' : 'Backend is initializing or claim not found. Try again in 20 seconds.'}
        </div>`;
      } finally {
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Check Status`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
