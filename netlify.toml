# Aegis Protocol — Netlify Deployment Config
# Runtime asset policy: unhashed JS/CSS must revalidate after deployment.

[build]
  base      = "frontend"
  publish   = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, no-cache, max-age=0, must-revalidate"

# 1. Netlify functions endpoints
[[redirects]]
  from   = "/api/gemini"
  to     = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from   = "/api/stock"
  to     = "/.netlify/functions/stock"
  status = 200

[[redirects]]
  from   = "/api/scout/stock"
  to     = "/.netlify/functions/stock"
  status = 200

# 2. Proxy backend API requests to Render
[[redirects]]
  from   = "/api/*"
  to     = "https://misinformation-1ouh.onrender.com/api/:splat"
  status = 200
  force  = true

# 3. Static site: unknown non-file routes remain genuine 404s.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
