[build]
  base      = "frontend"
  publish   = "."
  functions = "netlify/functions"
  # DEPLOY PAUSED — remove the ignore line below when ready to deploy
  ignore    = "exit 0"

# 1. Netlify functions endpoints
[[redirects]]
  from   = "/api/gemini"
  to     = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from   = "/api/stock"
  to     = "/.netlify/functions/stock"
  status = 200

[[redirects]]
  from   = "/api/scout/stock"
  to     = "/.netlify/functions/stock"
  status = 200

# 2. Proxy backend API requests to Render
[[redirects]]
  from   = "/api/*"
  to     = "https://misinformation-1ouh.onrender.com/api/:splat"
  status = 200
  force  = true

# 3. SPA Fallback (only for non-file routes)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
