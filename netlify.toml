# Aegis Protocol — Netlify Deployment Config
# Version: 3.7.0 | Updated: 2026-10-02

[build]
  base      = "frontend"
  publish   = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 1. Netlify functions endpoints
[[redirects]]
  from   = "/api/gemini"
  to     = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from   = "/api/stock"
  to     = "/.netlify/functions/stock"
  status = 200

[[redirects]]
  from   = "/api/scout/stock"
  to     = "/.netlify/functions/stock"
  status = 200

# 2. Proxy backend API requests to Render
[[redirects]]
  from   = "/api/*"
  to     = "https://misinformation-1ouh.onrender.com/api/:splat"
  status = 200
  force  = true

# 3. SPA Fallback (only for non-file routes)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
