[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -v --tb=short -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
markers =
    unit: Fast deterministic unit tests (no network, no DB)
    integration: Multi-component integration tests (FastAPI TestClient, in-memory DB)
    security: SSRF, XSS, and adversarial security tests
    slow: Long-running tests requiring live external APIs or network access
