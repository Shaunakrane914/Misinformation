services:
  - type: web
    name: aegis-protocol
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AEGIS_MOCK_LLM
        value: "false"
      - key: RSS_INGESTION_ENABLED
        value: "false"
      - key: SERVER_RESEARCH_TIMEOUT
        value: "120"
      - key: SERVER_RESEARCH_CHANNEL_TIMEOUT
        value: "15"
      - key: GEMINI_MODELS
        value: '["gemini-3.5-flash-lite"]'
      - key: DEFAULT_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_ADVISORY_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGIN
        value: https://aegis-protocol-110.pages.dev
      - key: ADMIN_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: YF_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
